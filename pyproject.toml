[project]
name = "posint-scanner"
version = "0.1.0"
description = "Modular passive OSINT scanner for domains: discovery, DNS recon, and host/service enrichment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "requests[socks]>=2.31",
    "tenacity>=8.2",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "tldextract>=5.1",
]

[project.optional-dependencies]
# The browser UI (`posint-scanner serve`). Optional so the core CLI stays
# dependency-light; install with `pip install -e '.[web]'`.
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
posint-scanner = "posint_scanner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/posint_scanner"]
# Jinja2 templates for the web UI aren't .py files, so include them explicitly.
artifacts = ["src/posint_scanner/web/templates/*.html"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "mypy>=1.9",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: hits real third-party endpoints (run with: pytest -m live)"]

[tool.mypy]
python_version = "3.11"
packages = ["posint_scanner"]
mypy_path = "src"
ignore_missing_imports = true
