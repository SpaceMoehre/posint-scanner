services:
  posint-scanner:
    build: .
    image: posint-scanner
    # Host-side bind is pinned to localhost: the UI can start active scans, so
    # it isn't exposed on all interfaces by default. Change to "8000:8000" only
    # on a network you control and trust.
    ports:
      - "127.0.0.1:8000:8000"
    # Persists the SQLite DB and an optional config.yaml
    # across container/image rebuilds. Drop config.yaml in ./data to use it;
    # the scanner runs fine without one.
    volumes:
      - ./data:/data
    # API keys (Shodan, Censys, Qualys, NVD) can be supplied as OSINT_* env
    # vars instead of config.yaml - see config.py. Uncomment to load them from
    # a local .env file (git-ignore it).
    # env_file:
    #   - .env
    # Reaps processes scanner tools orphan, so none linger as zombies in the
    # long-running server.
    init: true
    # Every external tool runs in a bubblewrap sandbox (read-only root, its own
    # tmpfs and PID namespace - see toolrun.py), which Docker's defaults block:
    # seccomp forbids the namespace syscalls, AppArmor the mounts, and the
    # masked /proc paths the sandbox's own /proc. The container keeps no added
    # capabilities. Check with:
    #   docker compose exec posint-scanner posint-scanner sandbox-check --db /data/posint.db
    # If it still fails (e.g. Ubuntu's restricted unprivileged user namespaces),
    # see the README's "Tool sandbox".
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - systempaths=unconfined
    restart: unless-stopped
